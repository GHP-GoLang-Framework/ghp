name: CD

# Publishes an "edge" image on every push to main that passes CI, and creates
# a CalVer release (YYYY.MM.DD[-N]) automatically right after — same pattern
# as Nexo: the tag marks when that build became available, created after the
# publish, not before. release.yml only covers the case of someone tagging a
# CalVer manually (the automatic path uses GITHUB_TOKEN, which does not
# trigger other workflows, so the versioned image + artifacts happen here).
# Both paths converge on two reusable workflows: docker-image.yml builds and
# scans a flavor of the image, release-artifacts.yml produces the distribution
# artifacts.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # The `workflow_run` event carries only the run's conclusion, never the
  # per-job results, so 'success' alone cannot distinguish "the suite ran
  # and passed" from "the suite was skipped by the changes filter" - both
  # report success at the run level. Today the filter forces the suite on
  # for every push to main, so this cannot fire; it is here so that a
  # future change to the filter fails the release loudly instead of
  # quietly cutting a CalVer tag from untested code.
  verify-tests-ran:
    name: Verify the test suite ran
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail if the CI run skipped the Go suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          skipped=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion == "skipped") | .name' \
            | grep -E '^(Unit Tests|Integration Tests|E2E Tests|Coverage \(min 90%\))$' \
            || true)

          if [ -n "$skipped" ]; then
            echo "::error::refusing to publish: the CI run skipped $skipped."
            echo "The changes filter in ci.yml must keep running the suite on push to main."
            exit 1
          fi

          echo "The Go suite ran on this commit."

  publish-edge-image:
    name: Publish Edge Image
    needs: [verify-tests-ran]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-image.yml
    with:
      # Check out the exact commit the green CI run saw, not the tip of main.
      ref: ${{ github.event.workflow_run.head_sha }}
      # Per-push tags: the commit sha (for provenance) and the edge stream.
      tags: |
        type=sha,prefix=
        type=raw,value=edge
    secrets: inherit

  release:
    name: Tag & Release
    needs: [publish-edge-image]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.split-tag.outputs.tag }}
      sha: ${{ steps.split-tag.outputs.sha }}
    steps:
      - name: Checkout repository
        # Checkout of the default branch (main), not the workflow_run head_sha:
        # this job runs with contents:write, and checking out the untrusted
        # event ref would be a "pwn request" (Semgrep workflow-run-target-code-checkout).
        # The release is pinned to the right commit via `gh release create
        # --target "$SHA"`, and the reusable workflow checks out $SHA directly
        # from the trusted published history.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute CalVer tag
        id: tag
        run: |
          # CalVer YYYY.MM.DD[-N] (UTC). The first release of the day is the
          # bare date; later releases on the same day append a counter as a
          # semver pre-release. The suffix went through two rejected forms: a
          # four-segment ".N" is not semver, so goreleaser refused the tag
          # ("failed to parse tag '2026.10.20.1' as semver"), and "+N" build
          # metadata is not a valid container image tag, so the image retag
          # failed with "invalid reference format". "-N" is the only form
          # accepted by both.
          #
          # GitHub only marks a release as a pre-release when the caller asks
          # for it (`gh release create -p`), which this workflow does not, so
          # the "-N" tag still produces a normal release.
          TODAY=$(date -u +%Y.%m.%d)
          # Match the "-N" suffix; a bare date plus its suffixed forms are one
          # series, and counting only the bare tag would hand out "-1" twice.
          EXISTING=$(git tag --list "$TODAY" "$TODAY-*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then TAG="$TODAY"; else TAG="$TODAY-$EXISTING"; fi
          echo "Releasing $TAG (existing today: $EXISTING)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # gh creates the tag at $SHA and the release in one call; --generate-notes
        # builds the body from the commits/PRs since the previous release.
        # goreleaser attaches the artifacts next (keep-existing preserves notes).
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

      # Split from the compute step: job outputs must come from a step, and
      # collapsing them here keeps `TAG`/`SHA` as job-level outputs consumed
      # by the release-artifacts job.
      - name: Export tag and sha outputs
        id: split-tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  release-artifacts:
    name: Release Artifacts
    needs: [publish-edge-image, release]
    uses: ./.github/workflows/release-artifacts.yml
    # A reusable workflow may only keep or reduce the caller's
    # permissions, never raise them, and release-artifacts.yml declares
    # contents: write. Without this the whole run is rejected before it
    # starts ("is only allowed 'contents: read'"), which left CD broken
    # on every push. Grant it here, on the one job that needs it.
    permissions:
      contents: write
      packages: write
    with:
      tag: ${{ needs.release.outputs.tag }}
      sha: ${{ needs.release.outputs.sha }}
      image: ghcr.io/${{ needs.publish-edge-image.outputs.image }}
      digest: ${{ needs.publish-edge-image.outputs.digest }}
    secrets: inherit