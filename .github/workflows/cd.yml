name: CD

# Publishes an "edge" image on every push to main that passes CI, and creates
# a CalVer release (YYYY.MM.DD[.N]) automatically right after — same pattern
# as Nexo: the tag marks when that build became available, created after the
# publish, not before. release.yml only covers the case of someone tagging a
# CalVer manually (this job uses GITHUB_TOKEN, which does not trigger other
# workflows, so release creation happens here).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-edge-image:
    name: Publish Edge Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.lowercase.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: lowercase
        # GHCR requires lowercase image names; github.repository preserves
        # the repo's actual case (e.g.: GHP-GoLang-Framework/GHP).
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=edge

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Tag & Release
    needs: [publish-edge-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        # Checkout of the default branch (main), not the workflow_run head_sha:
        # this job runs with contents:write, and checking out the untrusted
        # event ref would be a "pwn request" (Semgrep workflow-run-target-code-checkout).
        # The release is pinned to the right commit via `gh release create --target "$SHA"`
        # and via `git checkout "$SHA"` right below — a local checkout of a commit
        # already present in the trusted history, not a fetch of an external ref.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the exact released commit
        run: git checkout "${{ github.event.workflow_run.head_sha }}"

      - name: Compute CalVer tag
        id: tag
        run: |
          # CalVer YYYY.MM.DD[.N] (UTC). First release of the day without a
          # suffix; later releases on the same day get .1, .2, ...
          TODAY=$(date -u +%Y.%m.%d)
          EXISTING=$(git tag --list "$TODAY" "$TODAY.*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then TAG="$TODAY"; else TAG="$TODAY.$EXISTING"; fi
          echo "Releasing $TAG (existing today: $EXISTING)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build multi-platform binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            name="ghp_${TAG}_${GOOS}_${GOARCH}"
            echo "Building $name"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/ghp${ext}" ./src/cmd
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "ghp${ext}" && rm "ghp${ext}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "ghp${ext}" && rm "ghp${ext}")
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag, versioned image and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.publish-edge-image.outputs.image }}
          DIGEST: ${{ needs.publish-edge-image.outputs.digest }}
        run: |
          # Retags the image already built and scanned in the previous job (by
          # digest, no rebuild) with the CalVer version and "latest".
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

          # gh creates the tag at $SHA and the release together, with the
          # multi-platform binaries as assets; --generate-notes builds the body
          # from the commits/PRs since the previous release.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes dist/*
