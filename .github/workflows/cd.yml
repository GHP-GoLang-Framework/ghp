name: CD

# Publishes an "edge" image on every push to main that passes CI, and creates
# a CalVer release (YYYY.MM.DD[.N]) automatically right after — same pattern
# as Nexo: the tag marks when that build became available, created after the
# publish, not before. release.yml only covers the case of someone tagging a
# CalVer manually (the automatic path uses GITHUB_TOKEN, which does not
# trigger other workflows, so the versioned image + artifacts happen here).
# Both paths converge on the reusable release-artifacts.yml workflow.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-edge-image:
    name: Publish Edge Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.lowercase.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: lowercase
        # GHCR requires lowercase image names; github.repository preserves the
        # repo's actual case (e.g.: GHP-GoLang-Framework/ghp).
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=edge

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Tag & Release
    needs: [publish-edge-image]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.split-tag.outputs.tag }}
      sha: ${{ steps.split-tag.outputs.sha }}
    steps:
      - name: Checkout repository
        # Checkout of the default branch (main), not the workflow_run head_sha:
        # this job runs with contents:write, and checking out the untrusted
        # event ref would be a "pwn request" (Semgrep workflow-run-target-code-checkout).
        # The release is pinned to the right commit via `gh release create
        # --target "$SHA"`, and the reusable workflow checks out $SHA directly
        # from the trusted published history.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute CalVer tag
        id: tag
        run: |
          # CalVer YYYY.MM.DD[.N] (UTC). First release of the day without a
          # suffix; later releases on the same day get .1, .2, ...
          TODAY=$(date -u +%Y.%m.%d)
          EXISTING=$(git tag --list "$TODAY" "$TODAY.*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then TAG="$TODAY"; else TAG="$TODAY.$EXISTING"; fi
          echo "Releasing $TAG (existing today: $EXISTING)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # gh creates the tag at $SHA and the release in one call; --generate-notes
        # builds the body from the commits/PRs since the previous release.
        # goreleaser attaches the artifacts next (keep-existing preserves notes).
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

      # Split from the compute step: job outputs must come from a step, and
      # collapsing them here keeps `TAG`/`SHA` as job-level outputs consumed
      # by the release-artifacts job.
      - name: Export tag and sha outputs
        id: split-tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  release-artifacts:
    name: Release Artifacts
    needs: [publish-edge-image, release]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      sha: ${{ needs.release.outputs.sha }}
      image: ghcr.io/${{ needs.publish-edge-image.outputs.image }}
      digest: ${{ needs.publish-edge-image.outputs.digest }}
    secrets: inherit