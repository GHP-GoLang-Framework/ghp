name: Release

# Covers CalVer tags (YYYY.MM.DD[.N]) pushed manually by a human —
# e.g.: re-tagging an old commit, a one-off hotfix outside the normal flow.
# Tags created by cd.yml use GITHUB_TOKEN, which does not trigger other
# workflows, so cd.yml already creates a versioned image + release there; this
# workflow only ensures a manual tag also gets the versioned image and the
# distribution artifacts. Both paths converge on the reusable
# release-artifacts.yml workflow (which creates the release if it does not
# exist yet, keep-existing otherwise).
on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-image:
    name: Build & Publish Versioned Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.lowercase.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: lowercase
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-artifacts:
    name: Release Artifacts
    needs: [publish-image]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      image: ghcr.io/${{ needs.publish-image.outputs.image }}
      digest: ${{ needs.publish-image.outputs.digest }}
    secrets: inherit