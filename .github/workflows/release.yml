name: Release

# Covers CalVer tags (YYYY.MM.DD[+N]) pushed manually by a human —
# e.g.: re-tagging an old commit, a one-off hotfix outside the normal flow.
# Tags created by cd.yml use GITHUB_TOKEN, which does not trigger other
# workflows, so cd.yml already creates a versioned image + release there; this
# workflow only ensures a manual tag also gets the versioned image and the
# distribution artifacts. Both paths converge on the reusable
# docker-image.yml (build/scan/push) and release-artifacts.yml (artifacts)
# workflows — the latter creates the release if it does not exist yet,
# keep-existing otherwise.
on:
  push:
    tags:
      # The trailing * intentionally accepts any suffix (the "+N" counter),
      # and "+" is a glob metacharacter in filter patterns, so it is not
      # spelled out literally here.
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Build & Publish Versioned Image
    uses: ./.github/workflows/docker-image.yml
    with:
      # On a tag push the default checkout already points at the tag commit,
      # so no ref is passed; the tag itself becomes the image tag.
      tags: |
        type=raw,value=${{ github.ref_name }}
        type=raw,value=latest
    secrets: inherit

  release-artifacts:
    name: Release Artifacts
    needs: [publish-image]
    uses: ./.github/workflows/release-artifacts.yml
    # Same requirement as in cd.yml: the reusable workflow declares
    # contents: write and cannot raise the caller's permissions, so the
    # job that calls it must grant them.
    permissions:
      contents: write
      packages: write
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      image: ghcr.io/${{ needs.publish-image.outputs.image }}
      digest: ${{ needs.publish-image.outputs.digest }}
    secrets: inherit