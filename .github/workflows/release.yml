name: Release

# Covers CalVer tags (YYYY.MM.DD[.N]) pushed manually by a human —
# e.g.: re-tagging an old commit, a one-off hotfix outside the normal flow.
# Tags created by cd.yml use GITHUB_TOKEN, which does not trigger other
# workflows, so cd.yml already creates its own release on that path; this
# workflow only prevents a manual tag from ending up without a versioned image
# and without a release.
on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-image:
    name: Build & Publish Versioned Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: [publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build multi-platform binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            name="ghp_${TAG}_${GOOS}_${GOARCH}"
            echo "Building $name"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/ghp${ext}" ./src/cmd
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "ghp${ext}" && rm "ghp${ext}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "ghp${ext}" && rm "ghp${ext}")
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating the binary assets."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag dist/*
