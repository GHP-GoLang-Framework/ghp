name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'
  COVERAGE_MIN: '90'

jobs:
  # Decides whether the suite is worth running. A PR that only touches
  # docs or config pays nothing, but the push to main always reports
  # true: a squash there can carry Go changes from several branches, and
  # main is where a bad merge has to be caught.
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Check which files the PR changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NUL-separated so a file name containing a newline cannot forge
          # an extra entry, and nothing is word-split by the shell.
          while IFS= read -r -d '' file; do
            case "$file" in
              *.go | go.mod | go.sum | */go.mod | */go.sum)
                echo "go=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < <(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename + "\u0000"')

          echo "go=false" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l ./src)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./src/...

      # TEMPORARY: golangci-lint "latest" (resolved by the action) is still
      # built with go1.24, which refuses to lint a module with `go 1.26.5` in
      # the go.mod ("the Go language version used to build golangci-lint is
      # lower than the targeted Go version"). Re-enable once a release built
      # with go1.26+ exists, or migrate .golangci.yml to the v2 schema and pin
      # that version explicitly.
      # - name: golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   with:
      #     version: latest

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -short ./src/... -race

  integration-tests:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test ./src/test/integration/... -race

  e2e-tests:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ghp binary
        run: go build -o bin/ghp ./src/cmd

      - name: Run e2e tests
        run: go test ./src/test/e2e/...
        env:
          GHP_BINARY: ${{ github.workspace }}/bin/ghp

  coverage:
    name: Coverage (min 90%)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage (unit + integration)
        run: |
          go test ./src/... \
            -coverprofile=coverage.out -covermode=atomic -coverpkg=./src/...

      - name: Enforce minimum coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v min="${{ env.COVERAGE_MIN }}" 'BEGIN { exit (cov+0 < min) }' || {
            echo "::error::Coverage ${COVERAGE}% below the minimum of ${{ env.COVERAGE_MIN }}%"
            exit 1
          }

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./src/...

  goreleaser-check:
    name: GoReleaser Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Validate .goreleaser.yml
        run: goreleaser check

  # A job that calls a reusable workflow may only keep or reduce the
  # caller's permissions, never raise them. GitHub enforces this when the
  # run starts and reports a startup_failure, so neither the YAML parse nor
  # actionlint catches a mismatch beforehand: cd.yml and release.yml called
  # release-artifacts.yml with contents: read while it declares
  # contents: write, and every CD run since was rejected before its first
  # job. This checks the rule on every event, and does not depend on Go.
  workflow-permissions:
    name: Reusable Workflow Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      - name: Check caller permissions against each reusable workflow
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          RANK = {"write": 2, "read": 1, "none": 0}

          def load(path):
              with open(path) as fh:
                  return yaml.safe_load(fh) or {}

          def rank(value):
              return RANK.get(value or "none", 0)

          failed = False
          for caller_path in sorted(glob.glob(".github/workflows/*.yml")):
              caller = load(caller_path)
              caller_perms = caller.get("permissions") or {}
              for name, job in (caller.get("jobs") or {}).items():
                  uses = (job or {}).get("uses") or ""
                  if not uses.startswith("./"):
                      continue
                  callee_path = ".github/workflows/" + uses.rsplit("/", 1)[-1]
                  callee = load(callee_path)
                  # A job's own permissions replace the workflow-level ones.
                  effective = job.get("permissions") or caller_perms
                  for perm, want in (callee.get("permissions") or {}).items():
                      got = effective.get(perm)
                      if rank(got) < rank(want):
                          print(
                              f"::error file={caller_path}::job '{name}' calls "
                              f"{callee_path}, which requires {perm}: {want}, "
                              f"but the caller grants {got or 'none'}. GitHub "
                              f"rejects the run with a startup_failure."
                          )
                          failed = True
              print(f"checked {caller_path}")
          sys.exit(1 if failed else 0)
          PY

  govulncheck:
    name: Vulnerability Scan (govulncheck)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    # The action reports findings on the pull request, which needs
    # pull-requests: read on top of the workflow-level contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not set on pull requests from forks, where repository secrets
          # are withheld. The action degrades to a plain scan instead of
          # failing the run.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  pr-title:
    name: PR Title Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a conventional commit
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: CI Gate
    needs:
      - changes
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
      - coverage
      - build
      - goreleaser-check
      - govulncheck
      - gitleaks
      # Validates a rule GitHub only checks at run time, so it must block
      # the merge; a mismatch is invisible until CD refuses to start.
      - workflow-permissions
      # A non-conventional title used to leave the gate green: the check
      # was reported but nothing depended on it. Listing it here makes a
      # rejected title fail the gate on pull requests. On a push it is
      # skipped (see its own `if`), and skipped is not a failure.
      - pr-title
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs did not pass:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All required checks passed
        run: echo "CI gate green."
