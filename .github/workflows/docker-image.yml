name: Docker Image

# Reusable workflow that builds, scans and pushes one flavor of the ghp image
# on GHCR. cd.yml (edge, per merge) and release.yml (CalVer + latest) both
# converge here so the build/scan/push pipeline is defined in a single place.
#
# Caller contract:
#   - `ref`  : commit/ref to build. Empty (default) uses the caller's own ref;
#              cd.yml passes the head_sha of the green CI run on purpose.
#   - `tags` : docker/metadata-action tag spec, one rule per line (e.g.
#              "type=sha,prefix=\ntype=raw,value=edge").
#
# Outputs: `image` (lowercased GHCR name) and `digest`, consumed by
# release-artifacts.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit or ref to build. Empty uses the caller's own ref (already
          correct on a tag/merge).
        required: false
        type: string
      tags:
        description: >-
          docker/metadata-action tag spec, one rule per line (e.g.
          "type=sha,prefix=" and "type=raw,value=edge").
        required: true
        type: string
    outputs:
      image:
        description: Lowercased GHCR image name.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Manifest digest of the pushed image.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, scan and push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lowercase.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: lowercase
        # GHCR requires lowercase image names; github.repository preserves the
        # repo's actual case (e.g.: GHP-GoLang-Framework/ghp).
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}